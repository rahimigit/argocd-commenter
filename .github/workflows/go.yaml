name: go

on:
  # automatic triggers removed 2026-10-30 to stop burning hosted-runner minutes; run manually
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v2
      - uses: int128/go-actions/setup@v1
        with:
          go-version: 1.17
      - uses: golangci/golangci-lint-action@v2
        with:
          version: v1.44.0
          skip-go-installation: true
          skip-pkg-cache: true
          skip-build-cache: true
          args: --timeout=3m

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v2
      - uses: int128/go-actions/setup@v1
        with:
          go-version: 1.17
      #TODO: fix the integration test
      #- run: go test -v ./...
      - run: go test -v ./pkg/...
